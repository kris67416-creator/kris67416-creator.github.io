<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>做T助手</title>
<style>
:root{
  --bg:#0f1115; --card:#181b22; --card2:#1f232c; --line:#2a2f3a;
  --tx:#e8eaf0; --tx2:#9aa2b1; --tx3:#6b7281;
  --up:#f6465d; --down:#12b886; --warn:#f0a020; --acc:#4c8dff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
header{
  position:sticky;top:0;z-index:20;background:rgba(15,17,21,.92);
  backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;
  display:flex;align-items:center;gap:10px;
}
header h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.5px}
.mkt{font-size:11px;padding:3px 8px;border-radius:20px;background:var(--card2);color:var(--tx2);white-space:nowrap}
.mkt.open{background:rgba(18,184,134,.15);color:var(--down)}
.spacer{flex:1}
.iconbtn{
  background:var(--card2);border:1px solid var(--line);color:var(--tx);
  width:34px;height:34px;border-radius:9px;font-size:15px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
}
.iconbtn.on{background:rgba(76,141,255,.18);border-color:var(--acc);color:var(--acc)}
main{padding:12px 12px 0;max-width:720px;margin:0 auto}
.page{display:none}
.page.on{display:block}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;margin:0 0 12px;font-weight:600;color:var(--tx2);letter-spacing:.5px}

label{display:block;font-size:12px;color:var(--tx2);margin-bottom:5px}
input,select{
  width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);
  border-radius:9px;padding:10px 11px;font-size:16px;font-family:inherit;outline:none;
}
input:focus,select:focus{border-color:var(--acc)}
input[type=number]{-moz-appearance:textfield}
.row{display:flex;gap:9px;margin-bottom:10px}
.row>div{flex:1;min-width:0}
.btn{
  width:100%;background:var(--acc);color:#fff;border:0;border-radius:10px;
  padding:12px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit;
}
.btn.ghost{background:var(--card2);color:var(--tx2);border:1px solid var(--line);font-weight:500}
.btn.danger{background:rgba(246,70,93,.15);color:var(--up);border:1px solid rgba(246,70,93,.3)}

/* ---- 持仓卡 ---- */
.stk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:11px;position:relative}
.stk.sig-sell{border-color:rgba(246,70,93,.55);box-shadow:0 0 0 1px rgba(246,70,93,.18)}
.stk.sig-buy{border-color:rgba(18,184,134,.55);box-shadow:0 0 0 1px rgba(18,184,134,.18)}
.stk-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px}
.stk-name{font-size:16px;font-weight:600;line-height:1.25}
.stk-code{font-size:11px;color:var(--tx3);margin-top:2px;letter-spacing:.5px}
.stk-px{text-align:right;line-height:1.2}
.px-now{font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.px-chg{font-size:12px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.up{color:var(--up)} .down{color:var(--down)} .flat{color:var(--tx2)}

.pl{display:flex;gap:8px;margin-bottom:10px}
.pl>div{flex:1;background:var(--card2);border-radius:9px;padding:8px 9px;min-width:0}
.pl .k{font-size:10px;color:var(--tx3);margin-bottom:3px;white-space:nowrap}
.pl .v{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.mini div{font-size:10px;color:var(--tx3);text-align:center}
.mini b{display:block;font-size:12px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}

.bar{height:5px;border-radius:3px;background:linear-gradient(90deg,var(--down),#4a5060,var(--up));position:relative;margin:11px 0 5px}
.bar i{position:absolute;top:-3px;width:3px;height:11px;background:#fff;border-radius:2px;transform:translateX(-50%);box-shadow:0 0 4px rgba(0,0,0,.6)}
.barlab{display:flex;justify-content:space-between;font-size:10px;color:var(--tx3);font-variant-numeric:tabular-nums}

.sig{border-radius:10px;padding:9px 11px;font-size:13px;margin-top:10px;line-height:1.45;background:var(--card2);color:var(--tx2)}
.sig b{font-size:14px}
.sig.sell{background:rgba(246,70,93,.13);color:#ffb3bd}
.sig.sell b{color:var(--up)}
.sig.buy{background:rgba(18,184,134,.13);color:#8fe4c6}
.sig.buy b{color:var(--down)}
.stk-act{display:flex;gap:7px;margin-top:10px}
.stk-act button{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--tx2);border-radius:8px;padding:8px;font-size:12px;cursor:pointer;font-family:inherit}
.manual{display:none;margin-top:9px}
.manual.on{display:block}
.err{font-size:11px;color:var(--warn);margin-top:7px}

/* ---- 结果 ---- */
.res{background:var(--card2);border-radius:11px;padding:13px;margin-top:12px}
.res .big{font-size:27px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums;line-height:1.2}
.res .biglab{text-align:center;font-size:11px;color:var(--tx3);margin-top:3px;margin-bottom:12px}
.li{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.li:first-of-type{border-top:0}
.li span:first-child{color:var(--tx2)}
.li span:last-child{font-variant-numeric:tabular-nums;font-weight:600}
.hint{font-size:11px;color:var(--tx3);line-height:1.6;margin-top:10px}
.empty{text-align:center;color:var(--tx3);font-size:13px;padding:34px 16px;line-height:1.7}

.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;background:none;border:0;color:var(--tx2);padding:8px;border-radius:8px;font-size:13px;cursor:pointer;font-family:inherit}
.seg button.on{background:var(--acc);color:#fff;font-weight:600}

nav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;
  background:rgba(24,27,34,.97);backdrop-filter:blur(12px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav button{flex:1;background:none;border:0;color:var(--tx3);padding:11px 0 12px;font-size:11px;cursor:pointer;font-family:inherit}
nav button b{display:block;font-size:18px;font-weight:400;margin-bottom:1px}
nav button.on{color:var(--acc)}
.tag{font-size:10px;color:var(--tx3);margin-top:8px;text-align:center}
</style>
</head>
<body>

<header>
  <h1>做T助手</h1>
  <span class="mkt" id="mkt">—</span>
  <span class="spacer"></span>
  <button class="iconbtn" id="btnAuto" title="自动刷新">⟳</button>
  <button class="iconbtn" id="btnRefresh" title="立即刷新">↓</button>
</header>

<main>

<!-- ============ 监控 ============ -->
<section class="page on" id="p-watch">
  <div id="list"></div>
  <div class="empty" id="empty">还没有持仓<br>点下面「持仓」添加一只股票</div>
  <div class="tag" id="stamp"></div>
</section>

<!-- ============ 持仓管理 ============ -->
<section class="page" id="p-pos">
  <div class="card">
    <h2 id="formTitle">添加持仓</h2>
    <div class="row">
      <div><label>股票代码</label><input id="f_code" inputmode="numeric" placeholder="600000"></div>
      <div><label>名称（可留空）</label><input id="f_name" placeholder="自动获取"></div>
    </div>
    <div class="row">
      <div><label>持仓数量（股）</label><input id="f_qty" type="number" inputmode="decimal" placeholder="1000"></div>
      <div><label>成本价</label><input id="f_cost" type="number" inputmode="decimal" step="0.001" placeholder="10.000"></div>
    </div>
    <div class="row">
      <div><label>涨多少卖T（%）</label><input id="f_sell" type="number" inputmode="decimal" step="0.1" value="2"></div>
      <div><label>跌多少买回（%）</label><input id="f_buy" type="number" inputmode="decimal" step="0.1" value="2"></div>
    </div>
    <div class="row">
      <div><label>信号基准价</label>
        <select id="f_base">
          <option value="cost">持仓成本价</option>
          <option value="prev">昨日收盘价</option>
          <option value="open">今日开盘价</option>
        </select>
      </div>
      <div><label>单次T股数</label><input id="f_tqty" type="number" inputmode="decimal" placeholder="留空=半仓"></div>
    </div>
    <button class="btn" id="btnSave">保存</button>
    <button class="btn ghost" id="btnCancel" style="margin-top:8px;display:none">取消编辑</button>
  </div>
  <div id="posList"></div>
</section>

<!-- ============ 做T计算 ============ -->
<section class="page" id="p-calc">
  <div class="card">
    <h2>做T盈亏计算</h2>
    <div style="margin-bottom:10px"><label>选择持仓</label><select id="c_stock"></select></div>
    <div class="seg">
      <button class="on" data-mode="zheng">正T（先买后卖）</button>
      <button data-mode="dao">倒T（先卖后买）</button>
    </div>
    <div class="row">
      <div><label>做T股数</label><input id="c_qty" type="number" inputmode="decimal" placeholder="500"></div>
      <div><label>底仓数量</label><input id="c_hold" type="number" inputmode="decimal" placeholder="1000"></div>
    </div>
    <div class="row">
      <div><label id="lab1">买入价</label><input id="c_p1" type="number" inputmode="decimal" step="0.001"></div>
      <div><label id="lab2">卖出价</label><input id="c_p2" type="number" inputmode="decimal" step="0.001"></div>
    </div>
    <div style="margin-bottom:10px"><label>原持仓成本价</label><input id="c_cost" type="number" inputmode="decimal" step="0.001"></div>
    <button class="btn ghost" id="btnFill">用当前行情填价格</button>
    <div id="calcRes"></div>
  </div>
</section>

<!-- ============ 设置 ============ -->
<section class="page" id="p-set">
  <div class="card">
    <h2>交易费用</h2>
    <div class="row">
      <div><label>佣金费率（%）</label><input id="s_comm" type="number" inputmode="decimal" step="0.001" value="0.025"></div>
      <div><label>最低佣金（元）</label><input id="s_commmin" type="number" inputmode="decimal" value="5"></div>
    </div>
    <div class="row">
      <div><label>印花税（%，卖出）</label><input id="s_stamp" type="number" inputmode="decimal" step="0.001" value="0.05"></div>
      <div><label>过户费（%，双向）</label><input id="s_trans" type="number" inputmode="decimal" step="0.0001" value="0.001"></div>
    </div>
    <div class="hint">默认按万2.5佣金（最低5元）、印花税千分之0.5（仅卖出）、过户费十万分之1（双向）。以你券商实际费率为准。</div>
  </div>
  <div class="card">
    <h2>刷新与提醒</h2>
    <div class="row">
      <div><label>自动刷新间隔（秒）</label><input id="s_int" type="number" inputmode="numeric" value="6"></div>
      <div><label>非交易时段刷新</label><select id="s_off"><option value="0">暂停</option><option value="1">继续</option></select></div>
    </div>
    <div style="margin-bottom:10px"><label>触发信号时提醒</label><select id="s_alert"><option value="1">声音+通知</option><option value="2">仅声音</option><option value="0">关闭</option></select></div>
    <button class="btn ghost" id="btnNotify">开启系统通知权限</button>
  </div>
  <div class="card">
    <h2>数据备份</h2>
    <div class="hint" style="margin-top:0;margin-bottom:10px">数据只存在这台设备的浏览器里。换手机或清缓存前，把下面这串文字复制保存下来，粘回去就能恢复。</div>
    <textarea id="s_dump" rows="4" style="width:100%;background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:9px;padding:10px;font-size:12px;font-family:ui-monospace,monospace"></textarea>
    <div class="row" style="margin-top:9px;margin-bottom:0">
      <div><button class="btn ghost" id="btnExport">导出</button></div>
      <div><button class="btn ghost" id="btnImport">导入</button></div>
    </div>
  </div>
  <div class="card">
    <h2>关于</h2>
    <div class="hint" style="margin-top:0">
      单文件网页，保存到手机后离线也能打开用（行情需要联网）。<br>
      行情来自东方财富公开接口，约延迟数秒，仅供参考，一切以你券商交易软件为准。<br>
      本工具只做计算和提醒，不构成任何投资建议。
    </div>
    <button class="btn danger" id="btnClear" style="margin-top:11px">清空全部数据</button>
  </div>
</section>

</main>

<nav>
  <button class="on" data-page="watch"><b>📈</b>监控</button>
  <button data-page="pos"><b>💼</b>持仓</button>
  <button data-page="calc"><b>🧮</b>算T</button>
  <button data-page="set"><b>⚙️</b>设置</button>
</nav>

<script>
"use strict";
/* ---------------- 存储（失败也不影响使用） ---------------- */
var KEY = "zuot_v1";
var S = { pos: [], cfg: { comm:0.025, commMin:5, stamp:0.05, trans:0.001, itv:6, off:0, alert:1 } };
function load(){ try{ var r=localStorage.getItem(KEY); if(r){ var o=JSON.parse(r); if(o&&o.pos){ S.pos=o.pos; for(var k in o.cfg) S.cfg[k]=o.cfg[k]; } } }catch(e){} }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
load();

var $ = function(id){ return document.getElementById(id); };
function n(v){ var x=parseFloat(v); return isFinite(x)?x:0; }
function fx(v,d){ if(!isFinite(v)) return "—"; return v.toFixed(d===undefined?2:d); }
function money(v){ if(!isFinite(v)) return "—"; var s=v<0?"-":"+"; var a=Math.abs(v);
  if(a>=10000) return s+(a/10000).toFixed(2)+"万"; return s+a.toFixed(2); }
function cls(v){ return v>0?"up":(v<0?"down":"flat"); }

/* ---------------- 北京时间 / 交易时段 ---------------- */
function bjNow(){ var d=new Date(); return new Date(d.getTime()+(d.getTimezoneOffset()*60000)+8*3600000); }
function mktOpen(){
  var d=bjNow(), w=d.getDay(); if(w===0||w===6) return false;
  var m=d.getHours()*60+d.getMinutes();
  return (m>=570&&m<=690)||(m>=780&&m<=900);
}
function mktLabel(){
  var d=bjNow(), w=d.getDay();
  if(w===0||w===6) return "休市";
  var m=d.getHours()*60+d.getMinutes();
  if(m<570) return "未开盘";
  if(m>=570&&m<=690) return "早盘";
  if(m>690&&m<780) return "午间休市";
  if(m>=780&&m<=900) return "午盘";
  return "已收盘";
}

/* ---------------- 行情（JSONP，绕过跨域） ---------------- */
function secid(code){
  code = String(code).replace(/\D/g,"");
  var h = code.charAt(0);
  return ((h==="6"||h==="5"||h==="9")?"1.":"0.") + code;
}
function fetchQuote(code){
  return new Promise(function(res,rej){
    var cb = "jp"+Math.random().toString(36).slice(2)+Date.now().toString(36);
    var s = document.createElement("script");
    var t = setTimeout(function(){ done(); rej(new Error("超时")); }, 9000);
    function done(){ clearTimeout(t); try{ delete window[cb]; }catch(e){ window[cb]=undefined; } if(s.parentNode) s.parentNode.removeChild(s); }
    window[cb] = function(r){ done(); if(r&&r.data&&r.data.f43!=null&&r.data.f43!=="-") res(r.data); else rej(new Error("无数据")); };
    s.onerror = function(){ done(); rej(new Error("网络失败")); };
    s.src = "https://push2.eastmoney.com/api/qt/stock/get?invt=2&fltt=2&cb="+cb+
            "&fields=f43,f44,f45,f46,f47,f48,f57,f58,f60,f168,f169,f170&secid="+secid(code)+"&_="+Date.now();
    document.body.appendChild(s);
  });
}

/* ---------------- 费用 ---------------- */
function fee(price, qty, isSell){
  var c=S.cfg, amt=price*qty;
  var comm = Math.max(amt*c.comm/100, c.commMin);
  var trans = amt*c.trans/100;
  var stamp = isSell ? amt*c.stamp/100 : 0;
  return { amt:amt, comm:comm, trans:trans, stamp:stamp, total:comm+trans+stamp };
}
function tResult(p1,p2,qty){        // p1=买入价 p2=卖出价（正倒T数学相同）
  var fb=fee(p1,qty,false), fs=fee(p2,qty,true);
  var gross=(p2-p1)*qty;
  return { gross:gross, fb:fb, fs:fs, cost:fb.total+fs.total, net:gross-fb.total-fs.total };
}

/* ---------------- 页面切换 ---------------- */
var navs=document.querySelectorAll("nav button");
for(var i=0;i<navs.length;i++) navs[i].onclick=function(){
  for(var j=0;j<navs.length;j++) navs[j].classList.remove("on");
  this.classList.add("on");
  var ps=document.querySelectorAll(".page");
  for(var j=0;j<ps.length;j++) ps[j].classList.remove("on");
  $("p-"+this.dataset.page).classList.add("on");
  if(this.dataset.page==="pos") renderPos();
  if(this.dataset.page==="calc") fillCalcSelect();
  if(this.dataset.page==="set") loadCfgForm();
  window.scrollTo(0,0);
};

/* ---------------- 持仓表单 ---------------- */
var editIdx = -1;
$("btnSave").onclick=function(){
  var code=String($("f_code").value).replace(/\D/g,"");
  if(code.length<6){ alert("请输入6位股票代码"); return; }
  var p={ code:code, name:$("f_name").value.trim(), qty:n($("f_qty").value), cost:n($("f_cost").value),
          sell:n($("f_sell").value)||2, buy:n($("f_buy").value)||2, base:$("f_base").value, tqty:n($("f_tqty").value) };
  if(editIdx>=0){ p.q=S.pos[editIdx].q; S.pos[editIdx]=p; editIdx=-1; $("formTitle").textContent="添加持仓"; $("btnCancel").style.display="none"; }
  else S.pos.push(p);
  save(); clearForm(); renderPos(); render(); refresh();
};
$("btnCancel").onclick=function(){ editIdx=-1; clearForm(); $("formTitle").textContent="添加持仓"; this.style.display="none"; };
function clearForm(){ ["f_code","f_name","f_qty","f_cost","f_tqty"].forEach(function(k){ $(k).value=""; });
  $("f_sell").value=2; $("f_buy").value=2; $("f_base").value="cost"; }

function renderPos(){
  var h="";
  S.pos.forEach(function(p,i){
    h+='<div class="card"><div style="display:flex;align-items:center;gap:10px">'+
       '<div style="flex:1;min-width:0"><div style="font-weight:600">'+(p.name||("代码 "+p.code))+' <span style="color:var(--tx3);font-size:11px">'+p.code+'</span></div>'+
       '<div style="font-size:12px;color:var(--tx2);margin-top:3px">'+p.qty+' 股 · 成本 '+fx(p.cost,3)+' · 涨'+p.sell+'%卖 / 跌'+p.buy+'%买</div></div>'+
       '<button class="iconbtn" onclick="editPos('+i+')">✎</button>'+
       '<button class="iconbtn" onclick="delPos('+i+')">🗑</button></div></div>';
  });
  $("posList").innerHTML = h || '<div class="empty">暂无持仓</div>';
}
window.editPos=function(i){
  var p=S.pos[i]; editIdx=i;
  $("f_code").value=p.code; $("f_name").value=p.name||""; $("f_qty").value=p.qty; $("f_cost").value=p.cost;
  $("f_sell").value=p.sell; $("f_buy").value=p.buy; $("f_base").value=p.base||"cost"; $("f_tqty").value=p.tqty||"";
  $("formTitle").textContent="编辑持仓"; $("btnCancel").style.display="block"; window.scrollTo(0,0);
};
window.delPos=function(i){ if(!confirm("删除 "+(S.pos[i].name||S.pos[i].code)+" ？")) return;
  S.pos.splice(i,1); save(); renderPos(); render(); };

/* ---------------- 信号 ---------------- */
function signal(p,q){
  if(!q) return null;
  var base = p.base==="prev" ? q.prev : (p.base==="open" ? q.open : (p.cost>0?p.cost:q.prev));
  if(!(base>0)) base=q.prev;
  var st = base*(1+p.sell/100), bt = base*(1-p.buy/100);
  var out = { base:base, sellAt:st, buyAt:bt, type:"wait" };
  if(q.now>=st) out.type="sell";
  else if(q.now<=bt) out.type="buy";
  out.toSell = (st-q.now)/q.now*100;
  out.toBuy  = (q.now-bt)/q.now*100;
  return out;
}

/* ---------------- 渲染监控 ---------------- */
var Q = {};      // code -> quote
var ERR = {};    // code -> err
var MAN = {};    // code -> 手动价
var fired = {};

function render(){
  $("mkt").textContent = mktLabel();
  $("mkt").className = "mkt" + (mktOpen()?" open":"");
  if(!S.pos.length){ $("list").innerHTML=""; $("empty").style.display="block"; return; }
  $("empty").style.display="none";
  var h="";
  S.pos.forEach(function(p,i){
    var q=Q[p.code];
    if(MAN[p.code]>0 && q) q=Object.assign({},q,{now:MAN[p.code],chg:MAN[p.code]-q.prev,pct:(MAN[p.code]-q.prev)/q.prev*100});
    else if(MAN[p.code]>0) q={now:MAN[p.code],prev:0,open:0,hi:0,lo:0,chg:0,pct:0,name:p.name||p.code};
    var sg = q?signal(p,q):null;
    var mv = q?q.now*p.qty:0, pl = q?(q.now-p.cost)*p.qty:0, plp = (q&&p.cost>0)?(q.now/p.cost-1)*100:0;

    h+='<div class="stk'+(sg?(sg.type==="sell"?" sig-sell":(sg.type==="buy"?" sig-buy":"")):"")+'">';
    h+='<div class="stk-top"><div style="flex:1;min-width:0"><div class="stk-name">'+(p.name||(q&&q.name)||("代码"+p.code))+'</div><div class="stk-code">'+p.code+' · '+p.qty+'股 · 本'+fx(p.cost,3)+'</div></div>';
    if(q) h+='<div class="stk-px"><div class="px-now '+cls(q.pct)+'">'+fx(q.now,q.now<10?3:2)+'</div><div class="px-chg '+cls(q.pct)+'">'+(q.pct>0?"+":"")+fx(q.chg,3)+' ('+(q.pct>0?"+":"")+fx(q.pct)+'%)</div></div>';
    else h+='<div class="stk-px"><div class="px-now flat" style="font-size:17px">获取中…</div></div>';
    h+='</div>';

    if(q){
      h+='<div class="pl"><div><div class="k">浮动盈亏</div><div class="v '+cls(pl)+'">'+money(pl)+'</div></div>'+
         '<div><div class="k">盈亏比例</div><div class="v '+cls(plp)+'">'+(plp>0?"+":"")+fx(plp)+'%</div></div>'+
         '<div><div class="k">持仓市值</div><div class="v">'+fx(mv,0)+'</div></div></div>';
      if(q.prev>0){
        h+='<div class="mini"><div>今开<b class="'+cls(q.open-q.prev)+'">'+fx(q.open,2)+'</b></div>'+
           '<div>最高<b class="up">'+fx(q.hi,2)+'</b></div>'+
           '<div>最低<b class="down">'+fx(q.lo,2)+'</b></div>'+
           '<div>昨收<b>'+fx(q.prev,2)+'</b></div></div>';
        if(q.hi>q.lo){
          var pos=Math.max(0,Math.min(100,(q.now-q.lo)/(q.hi-q.lo)*100));
          h+='<div class="bar"><i style="left:'+pos+'%"></i></div><div class="barlab"><span>日内低 '+fx(q.lo,2)+'</span><span>位置 '+fx(pos,0)+'%</span><span>'+fx(q.hi,2)+' 日内高</span></div>';
        }
      }
      if(sg){
        var tq = p.tqty>0 ? p.tqty : Math.floor(p.qty/2/100)*100;
        if(sg.type==="sell"){
          var back = q.now*(1-p.buy/100);
          var gain = tResult(back, q.now, tq).net;
          h+='<div class="sig sell"><b>⬆ 可以卖T了</b><br>现价 '+fx(q.now,3)+' 已达触发价 '+fx(sg.sellAt,3)+'。<br>倒T：现价卖 '+tq+' 股，回落到 '+fx(back,3)+'（-'+fx(p.buy,1)+'%）买回 → 净赚约 '+fx(gain,0)+' 元（已扣费）。</div>';
        } else if(sg.type==="buy"){
          var out = q.now*(1+p.sell/100);
          var gain2 = tResult(q.now, out, tq).net;
          h+='<div class="sig buy"><b>⬇ 可以买回/低吸了</b><br>现价 '+fx(q.now,3)+' 已跌破触发价 '+fx(sg.buyAt,3)+'。<br>正T：现价买 '+tq+' 股，反弹到 '+fx(out,3)+'（+'+fx(p.sell,1)+'%）卖出 → 净赚约 '+fx(gain2,0)+' 元（已扣费）。</div>';
        } else {
          h+='<div class="sig">观望中 · 基准 '+fx(sg.base,3)+'<br>涨到 <b class="up">'+fx(sg.sellAt,3)+'</b> 卖T（还差 '+fx(sg.toSell)+'%）　跌到 <b class="down">'+fx(sg.buyAt,3)+'</b> 买回（还差 '+fx(sg.toBuy)+'%）</div>';
        }
      }
    }
    if(ERR[p.code]) h+='<div class="err">⚠ 行情获取失败（'+ERR[p.code]+'），可手动输入现价照常计算</div>';
    h+='<div class="stk-act"><button onclick="toggleMan('+i+')">手动输价</button><button onclick="goCalc('+i+')">去算T</button></div>';
    h+='<div class="manual" id="man'+i+'"><input type="number" inputmode="decimal" step="0.001" placeholder="输入现价" value="'+(MAN[p.code]||"")+'" oninput="setMan(\''+p.code+'\',this.value)"></div>';
    h+='</div>';
  });
  $("list").innerHTML=h;
  var st=$("stamp");
  st.textContent = lastTime ? ("更新于 "+lastTime+"　·　行情延迟数秒，仅供参考") : "";
}
window.toggleMan=function(i){ $("man"+i).classList.toggle("on"); };
window.setMan=function(code,v){ MAN[code]=n(v); render(); };
window.goCalc=function(i){
  var navb=document.querySelectorAll("nav button");
  navb[2].click();
  $("c_stock").value=String(i); onPickStock();
};

/* ---------------- 刷新 ---------------- */
var lastTime="", timer=null, autoOn=true;
function refresh(){
  if(!S.pos.length){ render(); return; }
  var codes={}; S.pos.forEach(function(p){ codes[p.code]=1; });
  var list=Object.keys(codes);
  Promise.all(list.map(function(c){
    return fetchQuote(c).then(function(d){
      Q[c]={ name:d.f58, now:+d.f43, hi:+d.f44, lo:+d.f45, open:+d.f46, prev:+d.f60, chg:+d.f169, pct:+d.f170 };
      delete ERR[c];
      S.pos.forEach(function(p){ if(p.code===c && !p.name){ p.name=d.f58; } });
    }).catch(function(e){ ERR[c]=e.message; });
  })).then(function(){
    save();
    var d=bjNow();
    lastTime=("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2)+":"+("0"+d.getSeconds()).slice(-2);
    render(); checkAlert();
  });
}
function checkAlert(){
  if(!S.cfg.alert) return;
  S.pos.forEach(function(p){
    var q=Q[p.code]; if(!q) return;
    var sg=signal(p,q); if(!sg||sg.type==="wait"){ fired[p.code]=""; return; }
    if(fired[p.code]===sg.type) return;
    fired[p.code]=sg.type;
    beep();
    if(S.cfg.alert==1 && "Notification" in window && Notification.permission==="granted"){
      try{ new Notification((p.name||p.code)+(sg.type==="sell"?" 可以卖T":" 可以买回"), { body:"现价 "+fx(q.now,3)+"（"+(q.pct>0?"+":"")+fx(q.pct)+"%）" }); }catch(e){}
    }
  });
}
function beep(){
  try{
    var C=window.AudioContext||window.webkitAudioContext; if(!C) return;
    var a=new C(), o=a.createOscillator(), g=a.createGain();
    o.connect(g); g.connect(a.destination); o.frequency.value=880; o.type="sine";
    g.gain.setValueAtTime(.001,a.currentTime);
    g.gain.exponentialRampToValueAtTime(.25,a.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.5);
    o.start(); o.stop(a.currentTime+.5);
  }catch(e){}
}
function loop(){
  if(timer) clearInterval(timer);
  var ms=Math.max(3,n(S.cfg.itv)||6)*1000;
  timer=setInterval(function(){
    if(!autoOn) return;
    if(!mktOpen() && !+S.cfg.off){ render(); return; }
    refresh();
  }, ms);
}
$("btnRefresh").onclick=refresh;
$("btnAuto").onclick=function(){ autoOn=!autoOn; this.classList.toggle("on",autoOn); };
$("btnAuto").classList.add("on");

/* ---------------- 算T ---------------- */
var mode="zheng";
var segs=document.querySelectorAll(".seg button");
for(var i=0;i<segs.length;i++) segs[i].onclick=function(){
  for(var j=0;j<segs.length;j++) segs[j].classList.remove("on");
  this.classList.add("on"); mode=this.dataset.mode;
  $("lab1").textContent = mode==="zheng" ? "买入价（先）" : "买回价（后）";
  $("lab2").textContent = mode==="zheng" ? "卖出价（后）" : "卖出价（先）";
  calc();
};
function fillCalcSelect(){
  var h=""; S.pos.forEach(function(p,i){ h+='<option value="'+i+'">'+(p.name||p.code)+' '+p.code+'</option>'; });
  $("c_stock").innerHTML = h || '<option value="-1">（无持仓，可直接手填）</option>';
  onPickStock();
}
function onPickStock(){
  var i=+$("c_stock").value; if(i<0||!S.pos[i]) return;
  var p=S.pos[i];
  $("c_hold").value=p.qty; $("c_cost").value=p.cost;
  $("c_qty").value = p.tqty>0?p.tqty:Math.floor(p.qty/2/100)*100;
  var now=MAN[p.code]||(Q[p.code]&&Q[p.code].now);
  if(now>0){ $("c_p1").value=fx(now,3); $("c_p2").value=fx(now*(1+p.sell/100),3); }
  calc();
}
$("c_stock").onchange=onPickStock;
$("btnFill").onclick=function(){
  var i=+$("c_stock").value; if(i<0||!S.pos[i]) return;
  var q=Q[S.pos[i].code]||{}; var now=MAN[S.pos[i].code]||q.now;
  if(!now){ alert("暂无行情，请手动填价"); return; }
  if(mode==="zheng"){ $("c_p1").value=fx(now,3); } else { $("c_p2").value=fx(now,3); }
  calc();
};
["c_qty","c_hold","c_p1","c_p2","c_cost"].forEach(function(k){ $(k).oninput=calc; });

function breakeven(p1,qty){       // 保本卖出价
  var lo=p1, hi=p1*1.5;
  for(var i=0;i<60;i++){ var m=(lo+hi)/2; if(tResult(p1,m,qty).net>0) hi=m; else lo=m; }
  return hi;
}
function calc(){
  var qty=n($("c_qty").value), hold=n($("c_hold").value), p1=n($("c_p1").value), p2=n($("c_p2").value), cost=n($("c_cost").value);
  if(!(qty>0&&p1>0&&p2>0)){ $("calcRes").innerHTML='<div class="hint">填好股数和买卖价格后自动计算。</div>'; return; }
  var r=tResult(p1,p2,qty);
  var newCost = hold>0 ? cost - r.net/hold : cost;
  var be = breakeven(p1,qty);
  var h='<div class="res"><div class="big '+cls(r.net)+'">'+money(r.net)+' 元</div><div class="biglab">本次做T净收益（已扣全部费用）</div>';
  h+='<div class="li"><span>毛价差收益</span><span class="'+cls(r.gross)+'">'+money(r.gross)+'</span></div>';
  h+='<div class="li"><span>买入佣金 + 过户费</span><span>-'+fx(r.fb.total)+'</span></div>';
  h+='<div class="li"><span>卖出佣金 + 过户费</span><span>-'+fx(r.fs.comm+r.fs.trans)+'</span></div>';
  h+='<div class="li"><span>印花税（卖出千分之'+fx(S.cfg.stamp*10,1)+'）</span><span>-'+fx(r.fs.stamp)+'</span></div>';
  h+='<div class="li"><span>费用合计</span><span>-'+fx(r.cost)+'</span></div>';
  if(hold>0&&cost>0){
    h+='<div class="li"><span>原持仓成本</span><span>'+fx(cost,3)+'</span></div>';
    h+='<div class="li"><span>做T后新成本</span><span class="'+(newCost<cost?"down":"up")+'">'+fx(newCost,3)+'</span></div>';
    h+='<div class="li"><span>成本变动</span><span class="'+(newCost<cost?"down":"up")+'">'+(newCost<cost?"↓":"↑")+fx(Math.abs(cost-newCost),3)+'（'+fx(Math.abs(cost-newCost)/cost*100)+'%）</span></div>';
  }
  h+='<div class="li"><span>保本卖出价（买入'+fx(p1,3)+'）</span><span>'+fx(be,3)+'</span></div>';
  h+='<div class="li"><span>需涨幅才不亏</span><span>'+fx((be/p1-1)*100)+'%</span></div>';
  h+='</div>';
  h+='<div class="hint">'+(mode==="zheng"
      ? "正T：先在低点买入同数量，涨上去后卖掉，底仓数量不变、成本被摊低。要求账户有足够可用资金。"
      : "倒T：先在高点卖出底仓的一部分，跌下来再买回同数量，底仓恢复原数量、成本被摊低。要求账户有足够底仓。")+'<br>做T做反了会抬高成本，上面的新成本会变红。</div>';
  $("calcRes").innerHTML=h;
}

/* ---------------- 设置 ---------------- */
function loadCfgForm(){
  $("s_comm").value=S.cfg.comm; $("s_commmin").value=S.cfg.commMin; $("s_stamp").value=S.cfg.stamp;
  $("s_trans").value=S.cfg.trans; $("s_int").value=S.cfg.itv; $("s_off").value=S.cfg.off; $("s_alert").value=S.cfg.alert;
}
["s_comm","s_commmin","s_stamp","s_trans","s_int","s_off","s_alert"].forEach(function(k){
  $(k).oninput=$(k).onchange=function(){
    S.cfg.comm=n($("s_comm").value); S.cfg.commMin=n($("s_commmin").value);
    S.cfg.stamp=n($("s_stamp").value); S.cfg.trans=n($("s_trans").value);
    S.cfg.itv=n($("s_int").value); S.cfg.off=$("s_off").value; S.cfg.alert=+$("s_alert").value;
    save(); loop();
  };
});
$("btnNotify").onclick=function(){ if("Notification" in window) Notification.requestPermission(); else alert("此浏览器不支持系统通知"); };
$("btnExport").onclick=function(){ $("s_dump").value=JSON.stringify(S); };
$("btnImport").onclick=function(){
  try{ var o=JSON.parse($("s_dump").value); if(!o.pos) throw 0;
    S.pos=o.pos; for(var k in o.cfg) S.cfg[k]=o.cfg[k];
    save(); loadCfgForm(); renderPos(); render(); refresh(); alert("导入成功");
  }catch(e){ alert("格式不对，请粘贴完整的备份文字"); }
};
$("btnClear").onclick=function(){ if(!confirm("确定清空全部持仓和设置？")) return;
  S={pos:[],cfg:{comm:0.025,commMin:5,stamp:0.05,trans:0.001,itv:6,off:0,alert:1}};
  save(); loadCfgForm(); renderPos(); render(); };

/* ---------------- 启动 ---------------- */
loadCfgForm(); renderPos(); render(); refresh(); loop();
setInterval(function(){ $("mkt").textContent=mktLabel(); $("mkt").className="mkt"+(mktOpen()?" open":""); }, 20000);
</script>
